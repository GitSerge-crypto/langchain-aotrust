name: Publish to PyPI

# Требует однократной настройки на PyPI: Trusted Publisher
#   owner: GitSerge-crypto · repo: langchain-aotrust · workflow: publish.yml · environment: release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # OIDC для Trusted Publishing (без токенов в секретах)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build .
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
